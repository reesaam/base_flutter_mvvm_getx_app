include: package:flutter_lints/flutter.yaml

# Barrel imports: analyzer plugin for all of `lib/` (red errors in IDE + analyze).
# After changing `plugins:`, restart the Dart Analysis Server.
#
# Suppress one line:
#   // ignore: barrel_import_lints/only_barrel_imports
# Suppress a file:
#   // ignore_for_file: barrel_import_lints/only_barrel_imports

plugins:
  barrel_import_lints:
    path: packages/barrel_import_lints
    diagnostics:
      only_barrel_imports: true

linter:
  rules:
    avoid_print: true
    prefer_relative_imports: true
    prefer_single_quotes: true
    avoid_empty_else: true

analyzer:
  errors:
    invalid_assignment: error
    invalid_import: error
    missing_return: error
    only_barrel_imports: error
    always_declare_return_types: warning
    always_use_package_imports: ignore
    annotate_overrides: warning
    avoid_as: warning
    avoid_empty_else: warning
    avoid_unnecessary_containers: warning
    unnecessary_import: warning
    prefer_relative_imports: warning
    unnecessary_this: warning
    unused_import: warning
    unrelated_type_equality_checks: error
